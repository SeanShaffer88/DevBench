appId: com.devbench.workbench
productName: DevBench
copyright: Copyright © 2026 DevBench Contributors
asar: false
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - windows/**/*
  - devbench.adapter.json
  - .devbench/team.json
  - package.json
  - "!node_modules/**/*"
win:
  icon: windows/DevBench.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
  applicationManifest: windows/DevBench.app.manifest
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

appId: com.devbench.workbench
productName: DevBench
copyright: Copyright © 2026 DevBench Contributors
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - server/**/*
  - shared/**/*
  - package.json
win:
  icon: windows/DevBench.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
    - target: appx
      arch:
        - x64
        - arm64
  applicationManifest: windows/DevBench.app.manifest
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
appx:
  applicationId: DevBench.Workbench
  backgroundColor: "#0f172a"
  displayName: DevBench Windows SDK Workbench

name: CI & Windows Desktop Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Vitest & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Windows multi-size .ico & .rc resources
        run: npx tsx scripts/generate-win-icon.mjs

      - name: Run automated verification suite
        run: npm test

      - name: Build production frontend & typecheck server/shared
        run: npm run build

  package-windows:
    name: Package Windows NSIS & Portable Executables
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workbench & Electron packaging dependencies
        run: |
          npm ci
          npm install --no-save electron electron-builder

      - name: Generate Windows .ico & build production bundle
        run: |
          npx tsx scripts/generate-win-icon.mjs
          npm run build

      - name: Build Windows NSIS (x64 + ARM64) & Portable EXE
        run: npx electron-builder --win nsis portable --config electron-builder.yml --publish never

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevBench-Windows-Installers
          path: |
            release/*.exe
            windows/DevBench.app.manifest
            windows/Package.appxmanifest
